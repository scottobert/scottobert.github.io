name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # Weekly scan on Mondays at 3 AM

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: 'latest'
        extended: true

    - name: Build site
      run: hugo --minify

    - name: Serve site locally
      run: |
        cd public
        python3 -m http.server 8080 &
        sleep 5
        curl -f http://localhost:8080 || exit 1
        
    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-report
        path: report_html.html

    - name: Create ZAP Summary
      if: always()
      run: |
        echo "## 🛡️ OWASP ZAP Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f report_html.html ]; then
          echo "Security scan completed. Check the artifact for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Summary" >> $GITHUB_STEP_SUMMARY
          # Parse basic results from JSON if available
          if [ -f report_json.json ]; then
            echo "- Scan completed at: $(date)" >> $GITHUB_STEP_SUMMARY
            echo "- Target: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ Security scan failed. Check the workflow logs." >> $GITHUB_STEP_SUMMARY
        fi

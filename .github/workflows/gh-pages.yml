# This workflow runs SonarCloud analysis and E2E tests before deploying the Hugo site to GitHub Pages. Deployment only occurs if both checks pass.
name: github pages

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build Hugo site
        run: hugo --buildDrafts --buildFuture
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [sonarcloud, e2e]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check for newly published posts
        id: check-new-posts
        run: |
          # Create script to check for newly published posts
          cat > check-new-posts.js << 'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          
          function getNewlyPublishedPosts() {
            try {
              // Get all posts that are now published (not future, not draft)
              const allPostsOutput = execSync('hugo list all', { encoding: 'utf-8' });
              const allPosts = parseHugoCSV(allPostsOutput);
              
              // Get posts that are still in the future
              let futurePosts = [];
              try {
                const futurePostsOutput = execSync('hugo list future', { encoding: 'utf-8' });
                futurePosts = parseHugoCSV(futurePostsOutput);
              } catch (e) {
                // No future posts or command failed - that's okay
                console.log('No future posts found or command failed:', e.message);
              }
              
              // Filter for posts published today
              const today = new Date();
              const todayString = today.toISOString().split('T')[0]; // YYYY-MM-DD format
              
              const publishedToday = allPosts.filter(post => {
                if (post.draft === 'true') return false;
                
                // Check if post's publish date is today
                const postDate = new Date(post.publishDate || post.date);
                const postDateString = postDate.toISOString().split('T')[0];
                
                return postDateString === todayString;
              });
              
              // Filter out posts that are still in the future
              const futurePostPaths = new Set(futurePosts.map(p => p.path));
              const newlyPublished = publishedToday.filter(post => !futurePostPaths.has(post.path));
              
              return { newlyPublished, publishedToday, futurePosts };
            } catch (error) {
              console.error('Error checking for newly published posts:', error);
              return { newlyPublished: [], publishedToday: [], futurePosts: [] };
            }
          }
          
          function parseHugoCSV(csvOutput) {
            const lines = csvOutput.trim().split('\\n');
            if (lines.length < 2) return []; // No data rows
            
            const headers = lines[0].split(',');
            const posts = [];
            
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i];
              if (!line.trim()) continue;
              
              // Parse CSV line (handling quoted fields)
              const values = parseCSVLine(line);
              const post = {};
              
              headers.forEach((header, index) => {
                post[header] = values[index] || '';
              });
              
              posts.push(post);
            }
            
            return posts;
          }
          
          function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
              const char = line[i];
              
              if (char === '"' && (i === 0 || line[i-1] === ',')) {
                inQuotes = true;
              } else if (char === '"' && inQuotes && (i === line.length - 1 || line[i+1] === ',')) {
                inQuotes = false;
              } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
              } else {
                current += char;
              }
            }
            
            result.push(current);
            return result;
          }
          
          function formatPostSummary(result) {
            const { newlyPublished, publishedToday, futurePosts } = result;
            
            let summary = '';
            
            // Report newly published posts
            if (newlyPublished.length === 0) {
              summary += 'No new posts published today.\\n\\n';
            } else {
              summary += `🎉 ${newlyPublished.length} new post${newlyPublished.length > 1 ? 's' : ''} published today:\\n\\n`;
              
              newlyPublished.forEach(post => {
                const postDate = new Date(post.publishDate || post.date);
                summary += `📝 **${post.title}**\\n`;
                summary += `   📅 Published: ${postDate.toLocaleDateString()}\\n`;
                summary += `   🔗 Path: ${post.path}\\n`;
                if (post.permalink) {
                  summary += `   🌐 URL: ${post.permalink}\\n`;
                }
                summary += '\\n';
              });
            }
            
            // Report upcoming posts
            if (futurePosts.length > 0) {
              // Sort future posts by publish date
              const sortedFuturePosts = futurePosts
                .map(post => ({
                  ...post,
                  publishDateTime: new Date(post.publishDate || post.date)
                }))
                .sort((a, b) => a.publishDateTime.getTime() - b.publishDateTime.getTime());
              
              summary += `📅 **Upcoming Posts (${futurePosts.length} scheduled):**\\n\\n`;
              
              // Show next 10 upcoming posts
              const postsToShow = sortedFuturePosts.slice(0, 10);
              postsToShow.forEach(post => {
                const postDate = post.publishDateTime;
                const daysFromNow = Math.ceil((postDate.getTime() - new Date().getTime()) / (1000 * 60 * 60 * 24));
                summary += `📄 **${post.title}**\\n`;
                summary += `   📅 Scheduled: ${postDate.toLocaleDateString()} (in ${daysFromNow} day${daysFromNow > 1 ? 's' : ''})\\n`;
                summary += `   🔗 Path: ${post.path}\\n`;
                summary += '\\n';
              });
              
              if (futurePosts.length > 10) {
                summary += `   ... and ${futurePosts.length - 10} more upcoming posts\\n\\n`;
              }
            } else {
              summary += '📅 **No upcoming posts scheduled.**\\n\\n';
            }
            
            return summary;
          }
          
          // Main execution
          const result = getNewlyPublishedPosts();
          const summary = formatPostSummary(result);
          
          console.log(summary.replace(/\\n/g, '\n'));
          
          // Set outputs for GitHub Actions
          console.log(`new_posts_count=${result.newlyPublished.length}`);
          console.log(`has_new_posts=${result.newlyPublished.length > 0}`);
          console.log(`summary=${summary}`);
          
          // Save outputs to GitHub Actions environment
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `new_posts_count=${result.newlyPublished.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_new_posts=${result.newlyPublished.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${summary}\n`);
          
          // Save detailed info to file for potential use in notifications
          if (result.newlyPublished.length > 0) {
            fs.writeFileSync('newly-published-posts.json', JSON.stringify(result.newlyPublished, null, 2));
          }
          
          // Also save all post data for Substack integration
          fs.writeFileSync('post-check-results.json', JSON.stringify(result, null, 2));
          EOF
          
          # Run the script
          node check-new-posts.js
      
      - name: Create Substack posts for new blog posts
        if: steps.check-new-posts.outputs.has_new_posts == 'true'
        env:
          SUBSTACK_API_TOKEN: ${{ secrets.SUBSTACK_API_TOKEN }}
          SUBSTACK_PUBLICATION_ID: ${{ secrets.SUBSTACK_PUBLICATION_ID }}
          BLOG_BASE_URL: ${{ vars.BLOG_BASE_URL || 'https://scottobert.github.io' }}
        run: |
          # Create script to post to Substack
          cat > create-substack-posts.js << 'EOF'
          const https = require('https');
          const fs = require('fs');
          
          const SUBSTACK_API_TOKEN = process.env.SUBSTACK_API_TOKEN;
          const SUBSTACK_PUBLICATION_ID = process.env.SUBSTACK_PUBLICATION_ID;
          const BLOG_BASE_URL = process.env.BLOG_BASE_URL;
          
          if (!SUBSTACK_API_TOKEN || !SUBSTACK_PUBLICATION_ID) {
            console.log('⚠️ Substack API credentials not configured. Skipping Substack post creation.');
            process.exit(0);
          }
          
          // Read the newly published posts
          const postResults = JSON.parse(fs.readFileSync('post-check-results.json', 'utf8'));
          const newlyPublished = postResults.newlyPublished;
          
          if (newlyPublished.length === 0) {
            console.log('No new posts to publish to Substack.');
            process.exit(0);
          }
          
          function createSubstackPost(post) {
            return new Promise((resolve, reject) => {
              // Generate Substack post content
              const postUrl = post.permalink || `${BLOG_BASE_URL}${post.path.replace('content/', '/').replace('.md', '/')}`;
              const publishDate = new Date(post.publishDate || post.date);
              
              // Create announcement-style content for Substack
              const substackTitle = `New Post: ${post.title}`;
              const substackBody = `I've just published a new blog post that you might find interesting!
              
          **${post.title}**
          
          Published on ${publishDate.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          })}
          
          Read the full post here: ${postUrl}
          
          ---
          
          This post was automatically shared from my blog. If you enjoy this content, consider subscribing to get notified of new posts!`;
              
              const postData = {
                type: 'newsletter',
                title: substackTitle,
                subtitle: `New blog post: ${post.title}`,
                body: substackBody,
                publication_id: parseInt(SUBSTACK_PUBLICATION_ID),
                audience: 'everyone', // or 'paid' for paid subscribers only
                draft: false, // Set to true if you want to create as draft first
                send_email: true, // Set to false if you don't want to send email notification
              };
              
              const postDataString = JSON.stringify(postData);
              
              const options = {
                hostname: 'substackapi.com',
                port: 443,
                path: '/v1/posts',
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${SUBSTACK_API_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(postDataString)
                }
              };
              
              const req = https.request(options, (res) => {
                let data = '';
                
                res.on('data', (chunk) => {
                  data += chunk;
                });
                
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    const response = JSON.parse(data);
                    console.log(`✅ Created Substack post for "${post.title}"`);
                    console.log(`   Substack URL: ${response.canonical_url || 'URL not available'}`);
                    resolve(response);
                  } else {
                    console.error(`❌ Failed to create Substack post for "${post.title}"`);
                    console.error(`   Status: ${res.statusCode}`);
                    console.error(`   Response: ${data}`);
                    reject(new Error(`HTTP ${res.statusCode}: ${data}`));
                  }
                });
              });
              
              req.on('error', (error) => {
                console.error(`❌ Network error creating Substack post for "${post.title}":`, error);
                reject(error);
              });
              
              req.write(postDataString);
              req.end();
            });
          }
          
          // Create Substack posts for all newly published blog posts
          async function createAllSubstackPosts() {
            console.log(`📧 Creating ${newlyPublished.length} Substack post${newlyPublished.length > 1 ? 's' : ''}...`);
            
            const results = [];
            
            for (const post of newlyPublished) {
              try {
                console.log(`\n📝 Creating Substack post for: ${post.title}`);
                const result = await createSubstackPost(post);
                results.push({ success: true, post: post.title, result });
                
                // Add delay between requests to be respectful to the API
                await new Promise(resolve => setTimeout(resolve, 2000));
              } catch (error) {
                console.error(`Failed to create Substack post for "${post.title}":`, error.message);
                results.push({ success: false, post: post.title, error: error.message });
              }
            }
            
            // Save results
            fs.writeFileSync('substack-results.json', JSON.stringify(results, null, 2));
            
            const successful = results.filter(r => r.success).length;
            const failed = results.filter(r => !r.success).length;
            
            console.log(`\n📊 Substack Integration Summary:`);
            console.log(`   ✅ Successful: ${successful}`);
            console.log(`   ❌ Failed: ${failed}`);
            
            if (failed > 0) {
              console.log('\n❌ Failed posts:');
              results.filter(r => !r.success).forEach(r => {
                console.log(`   - ${r.post}: ${r.error}`);
              });
            }
            
            return results;
          }
          
          createAllSubstackPosts()
            .then(() => {
              console.log('\n🎉 Substack integration completed!');
            })
            .catch((error) => {
              console.error('💥 Substack integration failed:', error);
              process.exit(1);
            });
          EOF
          
          # Run the Substack integration script
          node create-substack-posts.js
      
      - name: Display post publication status
        run: |
          if [ "${{ steps.check-new-posts.outputs.has_new_posts }}" == "true" ]; then
            echo "🎉 New posts detected in today's build!"
          else
            echo "📅 Daily build completed - checking publication status..."
          fi
          echo "${{ steps.check-new-posts.outputs.summary }}" | sed 's/\\n/\n/g'
      
      - name: Build
        run: hugo --minify
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./public
      
      - name: Create deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build completed:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Hugo version:** $(hugo version)" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-new-posts.outputs.has_new_posts }}" == "true" ]; then
            echo "- **New posts published:** ${{ steps.check-new-posts.outputs.new_posts_count }}" >> $GITHUB_STEP_SUMMARY
            
            # Add Substack integration results if available
            if [ -f "substack-results.json" ]; then
              SUBSTACK_SUCCESSFUL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('substack-results.json', 'utf8')).filter(r => r.success).length)")
              SUBSTACK_FAILED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('substack-results.json', 'utf8')).filter(r => !r.success).length)")
              echo "- **Substack posts created:** $SUBSTACK_SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
              if [ "$SUBSTACK_FAILED" != "0" ]; then
                echo "- **Substack posts failed:** $SUBSTACK_FAILED" >> $GITHUB_STEP_SUMMARY
              fi
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-new-posts.outputs.summary }}" | sed 's/\\n/\n/g' >> $GITHUB_STEP_SUMMARY
          else
            echo "- **New posts published:** 0" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload newly published posts info
        if: steps.check-new-posts.outputs.has_new_posts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newly-published-posts
          path: newly-published-posts.json
          retention-days: 30
      
      - name: Upload Substack integration results
        if: steps.check-new-posts.outputs.has_new_posts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: substack-integration-results
          path: |
            post-check-results.json
            substack-results.json
          retention-days: 30
